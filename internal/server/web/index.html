<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nandocodego</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/rail.css">
<link rel="stylesheet" href="css/transcript.css">
<link rel="stylesheet" href="css/permission.css">
<link rel="stylesheet" href="css/sessions.css">
<link rel="stylesheet" href="css/code.css">
<link rel="stylesheet" href="css/agents.css">
</head>
<body>
<!-- Layout skeleton only (BV-2). Every region is filled by js/features/*.js. -->
<div id="app" class="bv-app" data-nav="full" data-tree="full" data-rail="full" data-nav-active="project" data-tree-visible="true" data-rail-visible="true">
  <div id="header" class="bv-app__header"></div>
  <aside class="bv-app__nav" aria-label="Navigation">
    <div id="nav"></div>
    <div id="sessions" class="bv-app__sessions"></div>
  </aside>
  <aside id="tree" class="bv-app__tree" aria-label="Project files"></aside>
  <main class="bv-app__center">
    <div id="panel-toggles" class="bv-toggles">
      <button type="button" class="bv-toggles__btn bv-toggles__btn--tree" data-action="toggle-tree">Files</button>
      <button type="button" class="bv-toggles__btn bv-toggles__btn--rail" data-action="toggle-rail">Status</button>
    </div>
    <div id="transcript" class="bv-app__transcript" role="log" aria-live="polite"></div>
    <div id="permission" class="bv-app__permission" hidden></div>
    <div id="composer" class="bv-composer">
      <div id="mention-dropdown" class="bv-mention" hidden></div>
      <textarea id="message-input" class="bv-composer__input" rows="2" placeholder="Type a message... (Shift+Enter for newline)"></textarea>
      <button id="send-btn" type="button" class="bv-composer__send">Send</button>
    </div>
  </main>
  <aside id="rail" class="bv-app__rail" aria-label="Session status"></aside>
  <footer id="footer" class="bv-app__footer"></footer>
</div>
<div id="dialog"></div>
<div id="toasts" class="bv-toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
