version: 1
id: basic-refactor
description: Extract duplicated parsing logic without changing behavior.
tags:
  - deterministic
  - refactor
  - go
execution:
  timeout: 90s
  max_turns: 12
  max_tool_calls: 30
  permission_mode: default
  approval_strategy: allow
  environment:
    CGO_ENABLED: "0"
model:
  live:
    temperature: 0
  recorded:
    recording: default
tests:
  - name: go-test
    command: ["go", "test", "./..."]
    timeout: 30s
    required: true
workspace:
  allowed_changes:
    - "parser.go"
    - "parser_test.go"
  required_changes:
    - "parser.go"
  forbidden_changes:
    - "go.mod"
    - "go.sum"
  must_exist:
    - "parser.go"
    - "parser_test.go"
  must_not_exist: []
  max_changed_files: 2
  max_diff_lines: 80
golden:
  compare: exact
  files:
    - "parser.go"
checks:
  final_answer_contains:
    - "tests"
  required_tools:
    - FileRead
    - FileWrite
    - Bash
  forbidden_tools: []
weights:
  task_completion: 0.15
  tests: 0.40
  expected_files: 0.25
  change_scope: 0.15
  final_answer: 0.05
pass_threshold: 0.90
