version: "2"

run:
  tests: true
  build-tags:
    - integration
    - e2e

# Keep the pre-v0.1 baseline enforceable. Phase 18 owns expansion into the
# existing errcheck, revive, gosec, and broader style debt.
linters:
  default: none
  enable:
    - govet
    - staticcheck
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
