name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly, so vulnerabilities published after the last commit are still
    # caught (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gosec:
    # Report-only until the existing gosec backlog is triaged (Phase 18, see
    # .golangci.yml). Findings go to the repository's Security tab, where new
    # ones are flagged on pull requests without blocking CI.
    name: gosec (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -fmt sarif -out gosec.sarif -stdout -verbose text ./...

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gosec.sarif
          category: gosec

  govulncheck:
    # Blocking: fails when the code calls a Go module or standard-library
    # function with a known vulnerability.
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t nandocodego:scan .

      # Full report (all severities) for the Security tab; never fails the job.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nandocodego:scan
          version: v0.74.0
          format: sarif
          output: trivy-image.sarif

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Gate: fail only on critical/high findings that have a fix available,
      # so the job stays actionable instead of permanently red.
      - name: Fail on fixable critical/high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nandocodego:scan
          version: v0.74.0
          skip-setup-trivy: true
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
